<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeTrack</title>
<style>
:root {
  --bg-primary: #1a1a2e;
  --bg-secondary: #16213e;
  --bg-tertiary: #0f3460;
  --bg-card: #1e2a4a;
  --bg-input: #253559;
  --text-primary: #e8e8e8;
  --text-secondary: #a0a8c0;
  --text-muted: #6b7394;
  --accent: #e94560;
  --accent-hover: #ff6b81;
  --green: #4ecca3;
  --green-hover: #6be4bc;
  --border: #2a3a5c;
  --shadow: rgba(0,0,0,0.3);
  --radius: 8px;
  --transition: 0.2s ease;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
}

/* Header */
.header {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header h1 {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  letter-spacing: 1px;
}

.header-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}

/* Buttons */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background var(--transition), transform var(--transition);
  color: var(--text-primary);
}

.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary { background: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }

.btn-secondary { background: var(--bg-tertiary); }
.btn-secondary:hover { background: #1a4a80; }

.btn-ghost {
  background: transparent;
  color: var(--text-secondary);
  padding: 6px 10px;
}
.btn-ghost:hover { color: var(--text-primary); background: var(--bg-input); }

.btn-danger { background: #c0392b; }
.btn-danger:hover { background: #e74c3c; }

.btn-icon {
  width: 40px;
  height: 40px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-size: 18px;
}

/* Timer Bar */
.timer-bar {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px var(--shadow);
}

.timer-bar input[type="text"] {
  flex: 1;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  color: var(--text-primary);
  font-size: 15px;
  outline: none;
  transition: border-color var(--transition);
}

.timer-bar input[type="text"]:focus {
  border-color: var(--accent);
}

.timer-bar input[type="text"]::placeholder {
  color: var(--text-muted);
}

.project-select {
  position: relative;
}

.project-select-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  cursor: pointer;
  font-size: 14px;
  min-width: 160px;
  transition: border-color var(--transition);
}

.project-select-btn:hover { border-color: var(--accent); }

.project-color-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.project-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 220px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px var(--shadow);
  z-index: 200;
  display: none;
  max-height: 300px;
  overflow-y: auto;
}

.project-dropdown.open { display: block; }

.project-dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 14px;
  transition: background var(--transition);
}

.project-dropdown-item:hover { background: var(--bg-input); }

.project-dropdown-item.add-new {
  border-top: 1px solid var(--border);
  color: var(--accent);
  font-weight: 500;
}

.timer-display {
  font-size: 24px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  min-width: 110px;
  text-align: center;
  color: var(--text-primary);
}

.timer-display.running { color: var(--green); }

.btn-start {
  background: var(--green);
  width: 48px;
  height: 48px;
}
.btn-start:hover { background: var(--green-hover); }

.btn-stop {
  background: var(--accent);
  width: 48px;
  height: 48px;
}
.btn-stop:hover { background: var(--accent-hover); }

/* Main Content */
.main {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 24px;
  border-bottom: 1px solid var(--border);
}

.tab {
  padding: 10px 20px;
  background: none;
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  border-bottom: 2px solid transparent;
  transition: color var(--transition), border-color var(--transition);
}

.tab:hover { color: var(--text-primary); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }

/* Timeline View */
.day-group { margin-bottom: 24px; }

.day-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

.day-header-date {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-secondary);
}

.day-header-total {
  font-size: 14px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.entry-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  margin-bottom: 4px;
  transition: background var(--transition);
}

.entry-card:hover { background: var(--bg-input); }

.entry-color {
  width: 4px;
  height: 36px;
  border-radius: 2px;
  flex-shrink: 0;
}

.entry-info { flex: 1; min-width: 0; }

.entry-task {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.entry-project {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.entry-time {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.entry-range {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.entry-duration {
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 70px;
  text-align: right;
}

.entry-actions {
  display: flex;
  gap: 4px;
  opacity: 0;
  transition: opacity var(--transition);
}

.entry-card:hover .entry-actions { opacity: 1; }

.entry-actions button {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 4px;
  font-size: 14px;
  transition: color var(--transition), background var(--transition);
}

.entry-actions button:hover { color: var(--text-primary); background: var(--bg-tertiary); }
.entry-actions button.delete:hover { color: #e74c3c; }

/* Summary View */
.summary-section { margin-bottom: 32px; }

.summary-section h3 {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 16px;
  color: var(--text-secondary);
}

.summary-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.summary-label {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
  font-size: 14px;
}

.summary-label span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.summary-bar-wrap {
  flex: 1;
  height: 8px;
  background: var(--bg-input);
  border-radius: 4px;
  overflow: hidden;
}

.summary-bar {
  height: 100%;
  border-radius: 4px;
  transition: width 0.4s ease;
}

.summary-duration {
  font-size: 14px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  min-width: 80px;
  text-align: right;
}

/* Project expand/collapse */
.summary-row-toggle {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 6px;
  transition: transform 0.2s ease, color var(--transition);
  flex-shrink: 0;
}

.summary-row-toggle:hover { color: var(--text-primary); }
.summary-row-toggle.open { transform: rotate(0deg); }
.summary-row-toggle.closed { transform: rotate(-90deg); }

.project-tasks {
  padding-left: 28px;
  overflow: hidden;
  transition: max-height 0.3s ease;
}

.project-tasks.collapsed {
  max-height: 0 !important;
}

.project-task-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  color: var(--text-secondary);
}

.project-task-row .summary-bar-wrap { flex: 1; height: 6px; }
.project-task-row .summary-duration { font-size: 13px; min-width: 70px; }

/* Storage status */
.storage-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  margin-right: 8px;
}

.storage-status.connected {
  color: var(--green);
}

.storage-status.warning {
  color: #f39c12;
}

.storage-status .status-icon {
  font-size: 14px;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  min-width: 400px;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 16px 48px var(--shadow);
  transform: translateY(10px);
  transition: transform 0.2s ease;
}

.modal-overlay.open .modal { transform: translateY(0); }

.modal h2 {
  font-size: 18px;
  margin-bottom: 20px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 6px;
}

.form-group input,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
}

.form-group input:focus,
.form-group select:focus {
  border-color: var(--accent);
}

.form-row {
  display: flex;
  gap: 12px;
}

.form-row .form-group { flex: 1; }

.color-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.color-option {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color var(--transition), transform var(--transition);
}

.color-option:hover { transform: scale(1.15); }
.color-option.selected { border-color: var(--text-primary); }

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 24px;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state p {
  font-size: 15px;
  margin-bottom: 8px;
}

.empty-state .hint {
  font-size: 13px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Add entry button */
.add-entry-bar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 16px;
}

/* Date Filter */
.date-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.date-filter-presets {
  display: flex;
  gap: 4px;
}

.date-filter-presets button {
  padding: 6px 14px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}

.date-filter-presets button:hover {
  color: var(--text-primary);
  border-color: var(--text-muted);
}

.date-filter-presets button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--text-primary);
}

.date-filter-range {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: 8px;
}

.date-filter-range input[type="date"] {
  padding: 6px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text-primary);
  font-size: 13px;
  outline: none;
  font-family: inherit;
}

.date-filter-range input[type="date"]:focus {
  border-color: var(--accent);
}

.date-filter-range span {
  color: var(--text-muted);
  font-size: 13px;
}

.date-filter-clear {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 13px;
  padding: 6px 10px;
  border-radius: var(--radius);
  transition: color var(--transition);
}

.date-filter-clear:hover { color: var(--text-primary); }

/* Archived project badge */
.project-archived-badge {
  font-size: 11px;
  color: var(--text-muted);
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 6px;
  flex-shrink: 0;
}

/* Virtual scroll */
.virtual-scroll-container {
  position: relative;
  overflow-y: auto;
  max-height: calc(100vh - 260px);
}

.virtual-scroll-spacer {
  width: 100%;
}

.virtual-scroll-content {
  position: absolute;
  left: 0;
  right: 0;
}
</style>
</head>
<body>

<div class="header">
  <h1>TimeTrack</h1>
  <div class="header-actions">
    <span class="storage-status warning" id="storageStatus"><span class="status-icon">&#9888;</span> 保存先未選択</span>
    <button class="btn btn-secondary" id="btnFolder" title="保存先フォルダを選択">&#128193; 保存先フォルダ選択</button>
    <button class="btn btn-secondary" id="btnManageProjects">&#9881; プロジェクト管理</button>
  </div>
</div>

<div class="timer-bar">
  <input type="text" id="timerTask" placeholder="タスク名を入力...">
  <div class="project-select">
    <button class="project-select-btn" id="projectSelectBtn">
      <span class="project-color-dot" id="selectedProjectDot" style="background:#888"></span>
      <span id="selectedProjectName">プロジェクト未選択</span>
      <span style="margin-left:auto;font-size:10px">&#9660;</span>
    </button>
    <div class="project-dropdown" id="projectDropdown"></div>
  </div>
  <div class="timer-display" id="timerDisplay">0:00:00</div>
  <button class="btn btn-icon btn-start" id="btnTimer" title="スタート">&#9654;</button>
</div>

<div class="main">
  <div class="tabs">
    <button class="tab active" data-tab="timeline">タイムライン</button>
    <button class="tab" data-tab="summary">集計</button>
  </div>

  <div id="tabTimeline">
    <div class="add-entry-bar">
      <button class="btn btn-secondary" id="btnAddEntry">+ 手動追加</button>
    </div>
    <div id="timelineContent"></div>
  </div>

  <div id="tabSummary" style="display:none">
    <div class="date-filter">
      <div class="date-filter-presets">
        <button data-preset="today">今日</button>
        <button data-preset="yesterday">昨日</button>
        <button data-preset="week">今週</button>
        <button data-preset="all" class="active">全期間</button>
      </div>
      <div class="date-filter-range">
        <input type="date" id="filterFrom" title="開始日">
        <span>〜</span>
        <input type="date" id="filterTo" title="終了日">
      </div>
      <button class="date-filter-clear" id="filterClear">クリア</button>
    </div>
    <div id="summaryContent"></div>
  </div>
</div>

<!-- Entry Edit Modal -->
<div class="modal-overlay" id="entryModal">
  <div class="modal">
    <h2 id="entryModalTitle">エントリ編集</h2>
    <div class="form-group">
      <label>タスク名</label>
      <input type="text" id="entryEditTask">
    </div>
    <div class="form-group">
      <label>プロジェクト</label>
      <select id="entryEditProject"></select>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>開始日時</label>
        <input type="datetime-local" id="entryEditStart">
      </div>
      <div class="form-group">
        <label>終了日時</label>
        <input type="datetime-local" id="entryEditEnd">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="entryModalCancel">キャンセル</button>
      <button class="btn btn-primary" id="entryModalSave">保存</button>
    </div>
  </div>
</div>

<!-- Project Management Modal -->
<div class="modal-overlay" id="projectModal">
  <div class="modal">
    <h2>プロジェクト管理</h2>
    <div id="projectList" style="margin-bottom:20px"></div>
    <h3 style="font-size:15px;margin-bottom:12px" id="projectFormTitle">新規プロジェクト</h3>
    <div class="form-group">
      <label>プロジェクト名</label>
      <input type="text" id="projectName" placeholder="プロジェクト名">
    </div>
    <div class="form-group">
      <label>カラー</label>
      <div class="color-picker" id="colorPicker"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="projectModalCancel">閉じる</button>
      <button class="btn btn-primary" id="projectModalSave">追加</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// Color Presets
// ============================================================
const COLORS = ['#e94560','#4ecca3','#3498db','#f39c12','#9b59b6','#1abc9c','#e67e22','#2ecc71'];

// ============================================================
// StorageAdapter — monthly file splitting
// ============================================================
// File structure:
//   meta.json           — { version, projects, activeTimer }
//   entries_YYYY-MM.json — [ ...entries for that month ]
//
// Legacy migration: if data.json exists, it is read, split, and
// the old file is kept as a backup.
// ============================================================
class StorageAdapter {
  constructor() {
    this.dirHandle = null;
    this._pendingHandle = null; // stored handle awaiting permission re-grant
    this.supportsFS = typeof window.showDirectoryPicker === 'function';
  }

  get mode() {
    return this.dirHandle ? 'file' : (this.supportsFS ? 'none' : 'local');
  }

  async pickDirectory() {
    if (!this.supportsFS) return false;
    try {
      this.dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      await this._saveHandle(this.dirHandle);
      this._pendingHandle = null;
      return true;
    } catch {
      return false;
    }
  }

  // ---- File helpers ----
  async _readFile(name) {
    if (!this.dirHandle) return null;
    try {
      const fh = await this.dirHandle.getFileHandle(name);
      const file = await fh.getFile();
      const text = await file.text();
      return text.trim() ? JSON.parse(text) : null;
    } catch { return null; }
  }

  async _writeFile(name, obj) {
    if (!this.dirHandle) return false;
    try {
      const fh = await this.dirHandle.getFileHandle(name, { create: true });
      const w = await fh.createWritable();
      await w.write(JSON.stringify(obj, null, 2));
      await w.close();
      return true;
    } catch { return false; }
  }

  async _listEntryFiles() {
    if (!this.dirHandle) return [];
    const names = [];
    for await (const [name] of this.dirHandle) {
      if (/^entries_\d{4}-\d{2}\.json$/.test(name)) names.push(name);
    }
    return names.sort();
  }

  // ---- IndexedDB handle persistence ----
  async _saveHandle(handle) {
    return new Promise((resolve) => {
      const req = indexedDB.open('timetrack_meta', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
      req.onsuccess = e => {
        const tx = e.target.result.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(handle, 'dirHandle');
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => resolve(false);
      };
      req.onerror = () => resolve(false);
    });
  }

  async _loadHandle() {
    return new Promise((resolve) => {
      const req = indexedDB.open('timetrack_meta', 1);
      req.onupgradeneeded = e => e.target.result.createObjectStore('kv');
      req.onsuccess = e => {
        const tx = e.target.result.transaction('kv', 'readonly');
        const get = tx.objectStore('kv').get('dirHandle');
        get.onsuccess = () => resolve(get.result || null);
        get.onerror = () => resolve(null);
      };
      req.onerror = () => resolve(null);
    });
  }

  // Tries to restore the previously selected directory on startup.
  // Returns: 'restored' | 'prompt' | 'none' | 'unsupported'
  async restoreDirectory() {
    if (!this.supportsFS) return 'unsupported';
    try {
      const handle = await this._loadHandle();
      if (!handle) return 'none';
      const perm = await handle.queryPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        this.dirHandle = handle;
        return 'restored';
      }
      // Permission requires a user gesture to re-grant
      this._pendingHandle = handle;
      return 'prompt';
    } catch { return 'error'; }
  }

  // Re-requests permission for a stored handle (requires user gesture).
  async reconnectDirectory() {
    if (!this._pendingHandle) return false;
    try {
      const perm = await this._pendingHandle.requestPermission({ mode: 'readwrite' });
      if (perm === 'granted') {
        this.dirHandle = this._pendingHandle;
        this._pendingHandle = null;
        return true;
      }
      return false;
    } catch { return false; }
  }

  // ---- Public API ----
  async save(data) {
    // Build meta (everything except entries)
    const meta = {
      version: data.version,
      projects: data.projects,
      activeTimer: data.activeTimer
    };

    // Group entries by month
    const byMonth = {};
    data.entries.forEach(e => {
      const mk = monthKey(e.startTime);
      if (!byMonth[mk]) byMonth[mk] = [];
      byMonth[mk].push(e);
    });

    if (this.dirHandle) {
      try {
        // Write meta
        await this._writeFile('meta.json', meta);
        // Write only dirty months
        const dirtyMonths = data._dirtyMonths || Object.keys(byMonth);
        for (const mk of dirtyMonths) {
          await this._writeFile(`entries_${mk}.json`, byMonth[mk] || []);
        }
        data._dirtyMonths = [];
        return 'file';
      } catch { /* fall through */ }
    }

    // localStorage fallback — store everything together
    const flat = { ...meta, entries: data.entries };
    localStorage.setItem('timetrack_data', JSON.stringify(flat));
    return 'local';
  }

  async load() {
    if (this.dirHandle) {
      // Try new monthly format first
      const meta = await this._readFile('meta.json');
      if (meta) {
        const entryFiles = await this._listEntryFiles();
        let entries = [];
        for (const name of entryFiles) {
          const arr = await this._readFile(name);
          if (Array.isArray(arr)) entries = entries.concat(arr);
        }
        return { ...meta, entries };
      }
      // Legacy migration: single data.json
      const legacy = await this._readFile('data.json');
      if (legacy && legacy.version) {
        return legacy;  // caller will save in new format via commit()
      }
    }
    const raw = localStorage.getItem('timetrack_data');
    return raw ? JSON.parse(raw) : null;
  }

  exportJSON(data) {
    const flat = {
      version: data.version,
      projects: data.projects,
      activeTimer: data.activeTimer,
      entries: data.entries
    };
    const blob = new Blob([JSON.stringify(flat, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'timetrack-data.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  importJSON() {
    return new Promise((resolve) => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = async () => {
        if (!input.files[0]) return resolve(null);
        const text = await input.files[0].text();
        try { resolve(JSON.parse(text)); } catch { resolve(null); }
      };
      input.click();
    });
  }
}

// ============================================================
// AppState
// ============================================================
class AppState {
  constructor(storage) {
    this.storage = storage;
    this.data = { version: 1, projects: [], entries: [], activeTimer: null, _dirtyMonths: [] };
    this.listeners = [];
    this._saveTimeout = null;
  }

  async init() {
    const saved = await this.storage.load();
    if (saved && saved.version) {
      this.data = { ...saved, _dirtyMonths: [] };
    }
    this.notify();
  }

  onChange(fn) { this.listeners.push(fn); }

  notify() { this.listeners.forEach(fn => fn(this.data)); }

  _markDirty(iso) {
    const mk = monthKey(iso);
    if (!this.data._dirtyMonths) this.data._dirtyMonths = [];
    if (!this.data._dirtyMonths.includes(mk)) this.data._dirtyMonths.push(mk);
  }

  _scheduleSave() {
    clearTimeout(this._saveTimeout);
    this._saveTimeout = setTimeout(async () => {
      const mode = await this.storage.save(this.data);
      updateStorageStatus(mode);
    }, 500);
  }

  commit() {
    this.notify();
    this._scheduleSave();
  }

  // Projects
  addProject(name, color) {
    const proj = { id: 'proj_' + crypto.randomUUID().slice(0,8), name, color, createdAt: new Date().toISOString() };
    this.data.projects.push(proj);
    this.commit();
    return proj;
  }

  updateProject(id, name, color) {
    const p = this.data.projects.find(p => p.id === id);
    if (p) { p.name = name; p.color = color; this.commit(); }
  }

  archiveProject(id) {
    const p = this.data.projects.find(p => p.id === id);
    if (p) { p.archived = true; this.commit(); }
  }

  unarchiveProject(id) {
    const p = this.data.projects.find(p => p.id === id);
    if (p) { p.archived = false; this.commit(); }
  }

  deleteProject(id) {
    this.data.projects = this.data.projects.filter(p => p.id !== id);
    this.data.entries.forEach(e => { if (e.projectId === id) e.projectId = null; });
    if (this.data.activeTimer?.projectId === id) this.data.activeTimer.projectId = null;
    // Mark all months dirty since entries may span many months
    const months = new Set(this.data.entries.filter(e => e.projectId === null).map(e => monthKey(e.startTime)));
    months.forEach(mk => { if (!this.data._dirtyMonths.includes(mk)) this.data._dirtyMonths.push(mk); });
    this.commit();
  }

  getProject(id) { return this.data.projects.find(p => p.id === id) || null; }

  // Timer
  startTimer(task, projectId) {
    this.data.activeTimer = { task: task || '', projectId: projectId || null, startTime: new Date().toISOString() };
    this.commit();
  }

  stopTimer() {
    const t = this.data.activeTimer;
    if (!t) return null;
    const end = new Date();
    const start = new Date(t.startTime);
    const duration = Math.round((end - start) / 1000);
    const entry = {
      id: 'entry_' + crypto.randomUUID().slice(0,8),
      projectId: t.projectId,
      task: t.task || '(名称なし)',
      startTime: t.startTime,
      endTime: end.toISOString(),
      duration
    };
    this.data.entries.push(entry);
    this._markDirty(entry.startTime);
    this.data.activeTimer = null;
    this.commit();
    return entry;
  }

  // Entries
  addEntry(task, projectId, startTime, endTime) {
    const start = new Date(startTime);
    const end = new Date(endTime);
    const duration = Math.round((end - start) / 1000);
    if (duration <= 0) return null;
    const entry = {
      id: 'entry_' + crypto.randomUUID().slice(0,8),
      projectId: projectId || null,
      task: task || '(名称なし)',
      startTime: start.toISOString(),
      endTime: end.toISOString(),
      duration
    };
    this.data.entries.push(entry);
    this._markDirty(entry.startTime);
    this.commit();
    return entry;
  }

  updateEntry(id, task, projectId, startTime, endTime) {
    const e = this.data.entries.find(e => e.id === id);
    if (!e) return;
    this._markDirty(e.startTime); // old month
    const start = new Date(startTime);
    const end = new Date(endTime);
    e.task = task || '(名称なし)';
    e.projectId = projectId || null;
    e.startTime = start.toISOString();
    e.endTime = end.toISOString();
    e.duration = Math.round((end - start) / 1000);
    this._markDirty(e.startTime); // new month (may differ)
    this.commit();
  }

  deleteEntry(id) {
    const e = this.data.entries.find(e => e.id === id);
    if (e) this._markDirty(e.startTime);
    this.data.entries = this.data.entries.filter(e => e.id !== id);
    this.commit();
  }
}

// ============================================================
// Helpers
// ============================================================
function formatDuration(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function formatTime(iso) {
  const d = new Date(iso);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function formatDateGroup(iso) {
  const d = new Date(iso);
  const days = ['日','月','火','水','木','金','土'];
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`;
}

function dateKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function monthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function toLocalDatetime(iso) {
  const d = new Date(iso);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off * 60000);
  return local.toISOString().slice(0, 16);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// Storage Status
// ============================================================
function updateStorageStatus(mode) {
  const el = $('storageStatus');
  const btn = $('btnFolder');
  if (mode === 'file') {
    const folderName = storage.dirHandle ? storage.dirHandle.name : 'フォルダ';
    el.className = 'storage-status connected';
    el.innerHTML = `<span class="status-icon">&#10003;</span> ${escapeHtml(folderName)}`;
    btn.innerHTML = '&#128193; 保存先変更';
  } else if (mode === 'reconnect') {
    const name = storage._pendingHandle ? storage._pendingHandle.name : '保存先';
    el.className = 'storage-status warning';
    el.innerHTML = `<span class="status-icon">&#9888;</span> ${escapeHtml(name)}（要再接続）`;
    btn.innerHTML = '&#128279; 保存先に再接続';
  } else if (mode === 'local') {
    el.className = 'storage-status warning';
    el.innerHTML = `<span class="status-icon">&#9888;</span> localStorage保存（保存先未選択）`;
    btn.innerHTML = '&#128193; 保存先フォルダ選択';
  } else {
    el.className = 'storage-status warning';
    el.innerHTML = `<span class="status-icon">&#9888;</span> 保存先未選択`;
    btn.innerHTML = '&#128193; 保存先フォルダ選択';
  }
}

// ============================================================
// Folder Selection
// ============================================================
async function _onDirectoryConnected() {
  const saved = await storage.load();
  if (saved && saved.version && saved.entries?.length > 0) {
    const allMonths = [...new Set(saved.entries.map(e => monthKey(e.startTime)))];
    state.data = { ...saved, _dirtyMonths: allMonths };
  } else {
    const allMonths = [...new Set(state.data.entries.map(e => monthKey(e.startTime)))];
    state.data._dirtyMonths = allMonths;
  }
  state.commit();
  updateStorageStatus('file');
}

$('btnFolder').onclick = async () => {
  if (storage.supportsFS) {
    // If a stored handle needs permission re-grant, try reconnect first
    if (storage._pendingHandle) {
      const ok = await storage.reconnectDirectory();
      if (ok) { await _onDirectoryConnected(); return; }
    }
    const ok = await storage.pickDirectory();
    if (ok) { await _onDirectoryConnected(); }
  } else {
    const action = confirm('このブラウザはフォルダ保存非対応です。\nOK: データをエクスポート\nキャンセル: データをインポート');
    if (action) {
      storage.exportJSON(state.data);
    } else {
      const imported = await storage.importJSON();
      if (imported && imported.version) {
        state.data = { ...imported, _dirtyMonths: [] };
        state.commit();
      }
    }
  }
};

function updateTimerDisplay() {
  const at = state.data.activeTimer;
  if (!at) {
    timerDisplay.textContent = '0:00:00';
    timerDisplay.classList.remove('running');
    btnTimer.innerHTML = '&#9654;';
    btnTimer.className = 'btn btn-icon btn-start';

  const elapsed = Math.max(0, Math.round((Date.now() - new Date(at.startTime).getTime()) / 1000));
  timerDisplay.textContent = formatDuration(elapsed);
  timerDisplay.classList.add('running');
  btnTimer.innerHTML = '&#9632;';

}

// ============================================================
// Timeline View — Virtual Scroll
// ============================================================
// Flatten sorted entries into "rows" where each row is either
// a day-header or an entry-card. We assign fixed heights and
// only render the visible window.
// ============================================================
const ROW_HEIGHT_HEADER = 45;  // day-header height in px
const ROW_HEIGHT_ENTRY = 56;   // entry-card height in px
const SCROLL_BUFFER = 5;       // extra rows above/below viewport

let vsRows = [];       // { type:'header'|'entry', ... }
let vsContainer = null;
let vsSpacer = null;
let vsContent = null;

function buildVirtualRows(data) {
  const entries = [...data.entries].sort((a, b) => new Date(b.startTime) - new Date(a.startTime));
  const rows = [];

  if (entries.length === 0) return rows;

  const groups = {};
  entries.forEach(e => {
    const dk = dateKey(e.startTime);
    if (!groups[dk]) groups[dk] = { date: e.startTime, entries: [], total: 0 };
    groups[dk].entries.push(e);
    groups[dk].total += e.duration;
  });

  Object.keys(groups).sort().reverse().forEach(dk => {
    const g = groups[dk];
    rows.push({ type: 'header', date: g.date, total: g.total, height: ROW_HEIGHT_HEADER });
    g.entries.forEach(e => {
      rows.push({ type: 'entry', entry: e, height: ROW_HEIGHT_ENTRY });
    });
  });

  return rows;
}

function renderVirtualTimeline(data) {
  vsRows = buildVirtualRows(data);

  if (vsRows.length === 0) {
    timelineContent.innerHTML = `<div class="empty-state">
      <p>まだ記録がありません</p>
      <p class="hint">上のタイマーで計測を開始するか、「+ 手動追加」で記録を追加してください</p>
    </div>`;
    return;
  }

  // Set up container if not present
  if (!vsContainer) {
    timelineContent.innerHTML = '';
    vsContainer = document.createElement('div');
    vsContainer.className = 'virtual-scroll-container';
    vsSpacer = document.createElement('div');
    vsSpacer.className = 'virtual-scroll-spacer';
    vsContent = document.createElement('div');
    vsContent.className = 'virtual-scroll-content';
    vsContainer.appendChild(vsSpacer);
    vsContainer.appendChild(vsContent);
    timelineContent.appendChild(vsContainer);

    vsContainer.addEventListener('scroll', () => renderVisibleRows(data));
  }

  // Compute total height
  const totalHeight = vsRows.reduce((sum, r) => sum + r.height, 0);
  vsSpacer.style.height = totalHeight + 'px';

  renderVisibleRows(data);
}

function renderVisibleRows(data) {
  if (!vsContainer || vsRows.length === 0) return;

  const scrollTop = vsContainer.scrollTop;
  const viewportHeight = vsContainer.clientHeight;

  // Find first visible row
  let accum = 0;
  let startIdx = 0;
  for (let i = 0; i < vsRows.length; i++) {
    if (accum + vsRows[i].height > scrollTop) { startIdx = i; break; }
    accum += vsRows[i].height;
  }

  // Find last visible row
  let endIdx = startIdx;
  let visibleAccum = accum;
  for (let i = startIdx; i < vsRows.length; i++) {
    endIdx = i;
    visibleAccum += vsRows[i].height;
    if (visibleAccum >= scrollTop + viewportHeight) break;
  }

  // Add buffer
  startIdx = Math.max(0, startIdx - SCROLL_BUFFER);
  endIdx = Math.min(vsRows.length - 1, endIdx + SCROLL_BUFFER);

  // Compute offset for startIdx
  let offsetTop = 0;
  for (let i = 0; i < startIdx; i++) offsetTop += vsRows[i].height;

  // Render only visible rows
  let html = '';
  for (let i = startIdx; i <= endIdx; i++) {
    const row = vsRows[i];
    if (row.type === 'header') {
      html += `<div class="day-header" style="height:${ROW_HEIGHT_HEADER}px">
        <span class="day-header-date">${formatDateGroup(row.date)}</span>
        <span class="day-header-total">合計 ${formatDuration(row.total)}</span>
      </div>`;
    } else {
      const e = row.entry;
      const proj = data.projects.find(p => p.id === e.projectId);
      const color = proj ? proj.color : '#555';
      const projName = proj ? escapeHtml(proj.name) : 'プロジェクトなし';
      html += `<div class="entry-card" style="height:${ROW_HEIGHT_ENTRY - 4}px" data-id="${e.id}">
        <div class="entry-color" style="background:${color}"></div>
        <div class="entry-info">
          <div class="entry-task">${escapeHtml(e.task)}</div>
          <div class="entry-project">${projName}</div>
        </div>
        <div class="entry-time">
          <span class="entry-range">${formatTime(e.startTime)} - ${formatTime(e.endTime)}</span>
          <span class="entry-duration">${formatDuration(e.duration)}</span>
        </div>
        <div class="entry-actions">
          <button class="edit" title="編集" data-id="${e.id}">&#9998;</button>
          <button class="delete" title="削除" data-id="${e.id}">&times;</button>
        </div>
      </div>`;
    }
  }

  vsContent.style.top = offsetTop + 'px';
  vsContent.innerHTML = html;

  // Bind action handlers
  vsContent.querySelectorAll('.entry-actions .edit').forEach(btn => {
    btn.onclick = () => openEntryModal(btn.dataset.id);
  });
  vsContent.querySelectorAll('.entry-actions .delete').forEach(btn => {
    btn.onclick = () => {
      if (confirm('このエントリを削除しますか？')) state.deleteEntry(btn.dataset.id);
    };
  });
}

// ============================================================
// Summary View
// ============================================================
// ============================================================
// Date Filter
// ============================================================
let summaryFilterFrom = null;
let summaryFilterTo = null;

function todayRange() {
  const d = new Date();
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const end = new Date(start.getTime() + 86400000);
  return [start, end];
}

function yesterdayRange() {
  const d = new Date();
  const end = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const start = new Date(end.getTime() - 86400000);
  return [start, end];
}

function thisWeekRange() {
  const d = new Date();
  const day = d.getDay(); // 0=Sun
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((day + 6) % 7));
  const end = new Date(monday.getTime() + 7 * 86400000);
  return [monday, end];
}

function toDateString(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function setFilterPreset(preset) {
  const filterFrom = $('filterFrom');
  const filterTo = $('filterTo');

  document.querySelectorAll('.date-filter-presets button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.date-filter-presets button[data-preset="${preset}"]`)?.classList.add('active');

  if (preset === 'all') {
    summaryFilterFrom = null;
    summaryFilterTo = null;
    filterFrom.value = '';
    filterTo.value = '';
  } else {
    let range;
    if (preset === 'today') range = todayRange();
    else if (preset === 'yesterday') range = yesterdayRange();
    else if (preset === 'week') range = thisWeekRange();
    summaryFilterFrom = range[0];
    summaryFilterTo = range[1];
    filterFrom.value = toDateString(range[0]);
    filterTo.value = toDateString(new Date(range[1].getTime() - 86400000));
  }
  renderSummary(state.data);
}

function filterEntries(entries) {
  if (!summaryFilterFrom && !summaryFilterTo) return entries;
  return entries.filter(e => {
    const t = new Date(e.startTime);
    if (summaryFilterFrom && t < summaryFilterFrom) return false;
    if (summaryFilterTo && t >= summaryFilterTo) return false;
    return true;
  });
}

// Preset buttons
document.querySelectorAll('.date-filter-presets button').forEach(btn => {
  btn.onclick = () => setFilterPreset(btn.dataset.preset);
});

// Custom date range inputs
$('filterFrom').onchange = () => {
  const fromVal = $('filterFrom').value;
  const toVal = $('filterTo').value;
  document.querySelectorAll('.date-filter-presets button').forEach(b => b.classList.remove('active'));
  summaryFilterFrom = fromVal ? new Date(fromVal + 'T00:00:00') : null;
  summaryFilterTo = toVal ? new Date(toVal + 'T00:00:00') : null;
  if (summaryFilterTo) summaryFilterTo = new Date(summaryFilterTo.getTime() + 86400000);
  renderSummary(state.data);
};

$('filterTo').onchange = () => {
  const fromVal = $('filterFrom').value;
  const toVal = $('filterTo').value;
  document.querySelectorAll('.date-filter-presets button').forEach(b => b.classList.remove('active'));
  summaryFilterFrom = fromVal ? new Date(fromVal + 'T00:00:00') : null;
  summaryFilterTo = toVal ? new Date(toVal + 'T00:00:00') : null;
  if (summaryFilterTo) summaryFilterTo = new Date(summaryFilterTo.getTime() + 86400000);
  renderSummary(state.data);
};

$('filterClear').onclick = () => setFilterPreset('all');

// ============================================================
// Summary Rendering
// ============================================================
function renderSummary(data) {
  const filtered = filterEntries(data.entries);

  if (filtered.length === 0) {
    const msg = (summaryFilterFrom || summaryFilterTo)
      ? '選択した期間にデータがありません'
      : '集計データがありません';
    summaryContent.innerHTML = `<div class="empty-state"><p>${msg}</p></div>`;
    return;
  }

  // Total
  const totalDur = filtered.reduce((sum, e) => sum + e.duration, 0);

  // By project (with per-project tasks)
  const byProject = {};
  filtered.forEach(e => {
    const pid = e.projectId || '__none__';
    if (!byProject[pid]) byProject[pid] = { duration: 0, tasks: {} };
    byProject[pid].duration += e.duration;
    const taskKey = e.task || '(名称なし)';
    if (!byProject[pid].tasks[taskKey]) byProject[pid].tasks[taskKey] = 0;
    byProject[pid].tasks[taskKey] += e.duration;
  });

  const maxProjectDur = Math.max(...Object.values(byProject).map(v => v.duration));

  let html = `<div class="summary-section"><h3>合計: ${formatDuration(totalDur)}</h3></div>`;
  html += `<div class="summary-section"><h3>プロジェクト別</h3>`;
  Object.entries(byProject).sort((a,b) => b[1].duration - a[1].duration).forEach(([pid, info]) => {
    const proj = data.projects.find(p => p.id === pid);
    const color = proj ? proj.color : '#888';
    const name = proj ? escapeHtml(proj.name) : 'プロジェクトなし';
    const pct = maxProjectDur > 0 ? (info.duration / maxProjectDur * 100) : 0;
    const taskEntries = Object.entries(info.tasks).sort((a,b) => b[1] - a[1]);
    const maxTaskInProject = Math.max(...taskEntries.map(t => t[1]));

    html += `<div class="summary-row" data-project-toggle="${pid}" style="cursor:pointer">
      <button class="summary-row-toggle closed" data-pid="${pid}">&#9660;</button>
      <div class="summary-label">
        <span class="project-color-dot" style="background:${color}"></span>
        <span>${name}</span>
      </div>
      <div class="summary-bar-wrap"><div class="summary-bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="summary-duration">${formatDuration(info.duration)}</span>
    </div>`;

    html += `<div class="project-tasks collapsed" data-project-tasks="${pid}">`;
    taskEntries.forEach(([task, dur]) => {
      const taskPct = maxTaskInProject > 0 ? (dur / maxTaskInProject * 100) : 0;
      html += `<div class="project-task-row">
        <span style="flex:0 0 auto;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(task)}</span>
        <div class="summary-bar-wrap"><div class="summary-bar" style="width:${taskPct}%;background:${color};opacity:0.6"></div></div>
        <span class="summary-duration">${formatDuration(dur)}</span>
      </div>`;
    });
    html += `</div>`;
  });
  html += `</div>`;

  // By task
  const byTask = {};
  filtered.forEach(e => {
    const key = e.task || '(名称なし)';
    if (!byTask[key]) byTask[key] = { duration: 0, projectId: e.projectId };
    byTask[key].duration += e.duration;
  });

  const maxTaskDur = Math.max(...Object.values(byTask).map(v => v.duration));

  html += `<div class="summary-section"><h3>タスク別</h3>`;
  Object.entries(byTask).sort((a,b) => b[1].duration - a[1].duration).forEach(([task, info]) => {
    const proj = data.projects.find(p => p.id === info.projectId);
    const color = proj ? proj.color : '#888';
    const pct = maxTaskDur > 0 ? (info.duration / maxTaskDur * 100) : 0;
    html += `<div class="summary-row">
      <div class="summary-label">
        <span class="project-color-dot" style="background:${color}"></span>
        <span>${escapeHtml(task)}</span>
      </div>
      <div class="summary-bar-wrap"><div class="summary-bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="summary-duration">${formatDuration(info.duration)}</span>
    </div>`;
  });
  html += `</div>`;

  summaryContent.innerHTML = html;

  // Project expand/collapse handlers
  summaryContent.querySelectorAll('[data-project-toggle]').forEach(row => {
    row.onclick = () => {
      const pid = row.dataset.projectToggle;
      const tasksEl = summaryContent.querySelector(`[data-project-tasks="${pid}"]`);
      const toggleBtn = row.querySelector('.summary-row-toggle');
      if (!tasksEl) return;
      if (tasksEl.classList.contains('collapsed')) {
        tasksEl.classList.remove('collapsed');
        tasksEl.style.maxHeight = tasksEl.scrollHeight + 'px';
        toggleBtn.classList.remove('closed');
        toggleBtn.classList.add('open');
      } else {
        tasksEl.classList.add('collapsed');
        tasksEl.style.maxHeight = '0';
        toggleBtn.classList.remove('open');
        toggleBtn.classList.add('closed');
      }
    };
  });
}

// ============================================================
// Tabs
// ============================================================
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    $('tabTimeline').style.display = name === 'timeline' ? '' : 'none';
    $('tabSummary').style.display = name === 'summary' ? '' : 'none';
  };
});

// ============================================================
// Entry Modal
// ============================================================
function populateProjectSelect(selectEl, currentId) {
  let html = '<option value="">プロジェクトなし</option>';
  state.data.projects.forEach(p => {
    if (p.archived && p.id !== currentId) return; // アーカイブ済みは非表示（既存選択中は除く）
    const sel = p.id === currentId ? 'selected' : '';
    const label = p.archived ? `${escapeHtml(p.name)} [アーカイブ]` : escapeHtml(p.name);
    html += `<option value="${p.id}" ${sel} ${p.archived ? 'disabled' : ''}>${label}</option>`;
  });
  selectEl.innerHTML = html;
}

function openEntryModal(entryId) {
  editingEntryId = entryId || null;
  const modal = $('entryModal');
  const titleEl = $('entryModalTitle');

  populateProjectSelect($('entryEditProject'), null);

  if (entryId) {
    titleEl.textContent = 'エントリ編集';
    const entry = state.data.entries.find(e => e.id === entryId);
    if (!entry) return;
    $('entryEditTask').value = entry.task;
    $('entryEditProject').value = entry.projectId || '';
    $('entryEditStart').value = toLocalDatetime(entry.startTime);
    $('entryEditEnd').value = toLocalDatetime(entry.endTime);
  } else {
    titleEl.textContent = '手動エントリ追加';
    $('entryEditTask').value = '';
    $('entryEditProject').value = selectedProjectId || '';
    const now = new Date();
    const oneHourAgo = new Date(now.getTime() - 3600000);
    $('entryEditStart').value = toLocalDatetime(oneHourAgo.toISOString());
    $('entryEditEnd').value = toLocalDatetime(now.toISOString());
  }

  modal.classList.add('open');
}

$('entryModalCancel').onclick = () => $('entryModal').classList.remove('open');
$('entryModal').onclick = (e) => { if (e.target === $('entryModal')) $('entryModal').classList.remove('open'); };

$('entryModalSave').onclick = () => {
  const task = $('entryEditTask').value.trim();
  const projectId = $('entryEditProject').value || null;
  const startTime = $('entryEditStart').value;
  const endTime = $('entryEditEnd').value;

  if (!startTime || !endTime) return alert('開始日時と終了日時を入力してください');
  if (new Date(endTime) <= new Date(startTime)) return alert('終了日時は開始日時より後にしてください');

  if (editingEntryId) {
    state.updateEntry(editingEntryId, task, projectId, startTime, endTime);
  } else {
    state.addEntry(task, projectId, startTime, endTime);
  }
  $('entryModal').classList.remove('open');
};

$('btnAddEntry').onclick = () => openEntryModal(null);

// ============================================================
// Project Modal
// ============================================================
let selectedColor = COLORS[0];

function renderColorPicker() {
  const picker = $('colorPicker');
  picker.innerHTML = COLORS.map(c =>
    `<div class="color-option${c === selectedColor ? ' selected' : ''}" style="background:${c}" data-color="${c}"></div>`
  ).join('');
  picker.querySelectorAll('.color-option').forEach(el => {
    el.onclick = () => {
      selectedColor = el.dataset.color;
      picker.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
      el.classList.add('selected');
    };
  });
}

function openProjectModal(projectId) {
  editingProjectId = projectId || null;
  const modal = $('projectModal');
  const formTitle = $('projectFormTitle');
  const saveBtn = $('projectModalSave');

  if (projectId) {
    const proj = state.getProject(projectId);
    if (!proj) return;
    formTitle.textContent = 'プロジェクト編集';
    saveBtn.textContent = '更新';
    $('projectName').value = proj.name;
    selectedColor = proj.color;
  } else {
    formTitle.textContent = '新規プロジェクト';
    saveBtn.textContent = '追加';
    $('projectName').value = '';
    selectedColor = COLORS[0];
  }

  renderColorPicker();
  renderProjectList();
  modal.classList.add('open');
}

function renderProjectList() {
  const list = $('projectList');
  const active = state.data.projects.filter(p => !p.archived);
  const archived = state.data.projects.filter(p => p.archived);

  if (state.data.projects.length === 0) {
    list.innerHTML = '<p style="color:var(--text-muted);font-size:13px">プロジェクトがありません</p>';
    return;
  }

  const rowHtml = (p) => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);${p.archived ? 'opacity:0.6' : ''}">
      <span class="project-color-dot" style="background:${p.color}"></span>
      <span style="flex:1;font-size:14px">${escapeHtml(p.name)}</span>
      ${p.archived ? '<span class="project-archived-badge">アーカイブ</span>' : ''}
      ${!p.archived ? `<button class="btn btn-ghost" style="font-size:12px" onclick="openProjectModal('${p.id}')">編集</button>` : ''}
      <button class="btn btn-ghost" style="font-size:12px;color:var(--text-muted)" onclick="archiveProjectToggle('${p.id}', ${!!p.archived})">${p.archived ? '解除' : 'アーカイブ'}</button>
      <button class="btn btn-ghost delete" style="font-size:12px;color:#e74c3c" onclick="deleteProjectConfirm('${p.id}')">削除</button>
    </div>
  `;

  let html = active.map(rowHtml).join('');
  if (archived.length > 0) {
    html += `<p style="font-size:12px;color:var(--text-muted);margin:12px 0 4px">アーカイブ済み</p>`;
    html += archived.map(rowHtml).join('');
  }
  list.innerHTML = html;
}

window.archiveProjectToggle = (id, isArchived) => {
  if (isArchived) {
    state.unarchiveProject(id);
  } else {
    if (!confirm('このプロジェクトをアーカイブしますか？\n（新規タスクの計上ができなくなります。過去データは引き続き表示されます）')) return;
    state.archiveProject(id);
    // アーカイブされたプロジェクトがタイマーバーで選択中の場合は解除
    if (selectedProjectId === id) { selectedProjectId = null; updateSelectedProject(); }
  }
  renderProjectList();
};

window.deleteProjectConfirm = (id) => {
  if (confirm('このプロジェクトを削除しますか？\n（関連エントリのプロジェクト紐付けが解除されます）')) {
    state.deleteProject(id);
    if (selectedProjectId === id) { selectedProjectId = null; updateSelectedProject(); }
    renderProjectList();
  }
};

$('btnManageProjects').onclick = () => openProjectModal(null);
$('projectModalCancel').onclick = () => $('projectModal').classList.remove('open');
$('projectModal').onclick = (e) => { if (e.target === $('projectModal')) $('projectModal').classList.remove('open'); };

$('projectModalSave').onclick = () => {
  const name = $('projectName').value.trim();
  if (!name) return alert('プロジェクト名を入力してください');

  if (editingProjectId) {
    state.updateProject(editingProjectId, name, selectedColor);
    editingProjectId = null;
  } else {
    const proj = state.addProject(name, selectedColor);
    selectedProjectId = proj.id;
    updateSelectedProject();
  }
  $('projectName').value = '';
  editingProjectId = null;
  $('projectFormTitle').textContent = '新規プロジェクト';
  $('projectModalSave').textContent = '追加';
  selectedColor = COLORS[0];
  renderColorPicker();
  renderProjectList();
};

// ============================================================
// State Change Handler
// ============================================================
state.onChange(data => {
  vsContainer = null; // reset virtual scroll on data change
  renderVirtualTimeline(data);
  renderSummary(data);
  updateSelectedProject();
});

// ============================================================
// Init
// ============================================================
(async () => {
  const restoreStatus = await storage.restoreDirectory();
  await state.init();
  if (restoreStatus === 'restored') {
    updateStorageStatus('file');
  } else if (restoreStatus === 'prompt') {
    updateStorageStatus('reconnect');
  } else {
    updateStorageStatus(storage.mode === 'none' ? '' : storage.mode);
  }
  if (state.data.activeTimer) {
    timerTask.value = '';
    selectedProjectId = state.data.activeTimer.projectId;
    updateSelectedProject();
    startTimerTick();
  }
})();
</script>
</body>
</html>
